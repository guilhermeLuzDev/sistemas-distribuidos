services:
  # 1. Message Broker (RabbitMQ com Painel Web de Gestão)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: conversor-rabbitmq
    ports:
      - "5672:5672"   # Protocolo AMQP para producers e consumers
      - "15672:15672" # Painel Web (login: guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - conversor-net

  # 2. Object Storage S3-Compatible (MinIO)
  minio:
    image: elestio/minio:latest
    container_name: conversor-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # Console Web MinIO (login: minioadmin/minioadmin)
    networks:
      - conversor-net

  # 3. Servidor SMTP de Teste com Interface Web (Mailpit)
  mailpit:
    image: axllent/mailpit:latest
    container_name: conversor-mailpit
    ports:
      - "8025:8025" # Interface Web de visualização de e-mails
      - "1025:1025" # Servidor SMTP
    networks:
      - conversor-net

  # 4. Persistência do Estado dos Jobs (Redis)
  redis:
    image: redis:alpine
    container_name: conversor-redis
    networks:
      - conversor-net

  # 5. Frontend e API de Ingestão (Producer)
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: conversor-api
    ports:
      - "8000:5000" # Interface Web acessível em http://localhost:8000
    environment:
      - RABBITMQ_HOST=rabbitmq
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - REDIS_HOST=redis
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - conversor-net

  # 6. Worker de Conversão (Consumer com FFmpeg + Pillow)
  # Pode ser escalado com: docker compose up -d --scale worker=2
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    environment:
      - RABBITMQ_HOST=rabbitmq
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - REDIS_HOST=redis
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - conversor-net

  # 7. Serviço de Notificação por E-mail (Consumer Desacoplado)
  notifier:
    build:
      context: ./notifier
      dockerfile: Dockerfile
    container_name: conversor-notifier
    environment:
      - RABBITMQ_HOST=rabbitmq
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - conversor-net

networks:
  conversor-net:
    driver: bridge
