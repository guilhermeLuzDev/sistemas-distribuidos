services:
  # Balanceador de Carga NGINX (Único Ponto de Entrada para os usuários)
  loadbalancer:
    image: nginx:alpine
    container_name: loadbalancer
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app-01
      - app-02
      - app-03
    restart: unless-stopped
    networks:
      - app-network

  # Instância 1
  app-01:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: app-01
    environment:
      - INSTANCE_ID=app-01
      - TZ=America/Sao_Paulo
    ports:
      - "3001:5000"
    restart: unless-stopped
    networks:
      - app-network

  app-02:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: app-02
    environment:
      - INSTANCE_ID=app-02
      - TZ=America/Sao_Paulo
    ports:
      - "3002:5000"
    restart: unless-stopped
    networks:
      - app-network

  app-03:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: app-03
    environment:
      - INSTANCE_ID=app-03
      - TZ=America/Sao_Paulo
    ports:
      - "3003:5000"
    restart: unless-stopped
    networks:
      - app-network

  app-04:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: app-04
    environment:
      - INSTANCE_ID=app-04
      - TZ=America/Sao_Paulo
    ports:
      - "3004:5000"
    profiles:
      - scale
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
