events {}

http {
    upstream backend_servers {
        server app-01:5000;
        server app-02:5000;
        server app-03:5000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backend_servers;
            proxy_next_upstream error timeout http_502;
        }

        location /health {
            proxy_pass http://backend_servers/health;
        }
    }
}
